# Anthropic Glassmorphism Theme for Hyprland

# --- Colors (Anthropic Brand) ---
$anthropic_dark = rgb(141413)
$anthropic_light = rgb(faf9f5)
$anthropic_mid_gray = rgb(b0aea5)
$anthropic_light_gray = rgb(e8e6dc)
$anthropic_orange = rgb(d97757)
$anthropic_blue = rgb(6a9bcc)
$anthropic_green = rgb(788c5d)

# --- General Styling ---
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    
    # Active border is a gradient of the Anthropic Accent Colors
    col.active_border = $anthropic_orange $anthropic_blue $anthropic_green 45deg
    
    # Inactive border is Mid Gray to blend in but stay visible
    col.inactive_border = $anthropic_mid_gray

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# --- Glassmorphism & Decorations ---
decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 8
        passes = 3
        ignore_opacity = true
        xray = false
    }

    # Add depth with shadows (Hyprland 0.40+ syntax)
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(14141366)
    }
}

# --- Animations ---
animations {
    enabled = yes

    # Snappy but smooth curves
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, default
    animation = border, 1, 10, default
    animation = fade, 1, 10, smoothIn
    animation = fadeDim, 1, 10, smoothIn
    animation = workspaces, 1, 6, default
}
