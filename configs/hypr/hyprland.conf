source = ~/Pictures/hyprland/hyprland-claude/configs/hypr/theme.conf

# ==========================================
# CONFIG HYPRLAND — SIRIUS / DARK SPACE
# Optimized for: NixOS + NVIDIA PRIME + Laptop
# ==========================================

autogenerated = 0

# ==========================================
# MONITOR
# ==========================================
# Memaksa resolusi tinggi dengan bitdepth 10 untuk HDR
monitor = , highres, auto, 1, bitdepth, 10

# ==========================================
# RENDERING & COLOR MANAGEMENT (HDR)
# ==========================================
render {
    direct_scanout = 2
    cm_enabled = 1               # Enable color management pipeline
    cm_fs_passthrough = 2        # Allow HDR passthrough for fullscreen apps
    cm_sdr_eotf = 2              # SDR tone mapping (gamma 2.2, good for most screens)
}

# ==========================================
# ENVIRONMENT VARIABLES
# ==========================================
# (Sebagian besar sudah ada di nix-config-now.nix lo)
env = XCURSOR_SIZE, 24
#env = XCURSOR_THEME, Adwaita
env = XCURSOR_THEME, kanade
env = AQ_NO_MODIFIERS, 1
env = GDK_BACKEND,wayland,x11
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# NVIDIA Specific (Double check di Nix Config juga)
env = LIBVA_DRIVER_NAME, nvidia
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = GBM_BACKEND, nvidia-drm
env = QML2_IMPORT_PATH, /run/current-system/sw/lib/qt-6/qml

# Qt / QML Rendering Optimizations for Caelestia
env = QSG_RHI_BACKEND, vulkan
env = QSG_RENDER_LOOP, basic
env = QT_QUICK_COMPILER_SKIPPED, 0
env = QML_DISABLE_DISK_CACHE, 0

# ==========================================
# CURSOR
# ==========================================
cursor {
    no_hardware_cursors = true
    inactive_timeout    = 3
    hide_on_key_press   = true
}

# Enforce cursor theme for X11/GTK apps in Hyprland
#exec-once = hyprctl setcursor Adwaita 24
exec-once = hyprctl setcursor kanade 24
env = XCURSOR_SIZE, 24
#env = XCURSOR_THEME, Adwaita
env = XCURSOR_THEME, kanade

# ==========================================
# VARIABLES
# ==========================================
$terminal    = kitty
$browser     = firefox
$filemanager = thunar
$menu        = fuzzel
$mainMod     = SUPER
$offload     = nvidia-offload

# ==========================================
# AUTOSTART
# ==========================================
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = waybar
exec-once = swaync
exec-once = swaybg -i /home/juang/Pictures/wallpaper.png -m fill
exec-once = /run/current-system/sw/libexec/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# exec-once = hypridle           # Managed by home-manager
# nm-applet and blueman-applet disabled — Caelestia Shell handles network/BT natively
# exec-once = nm-applet --indicator
# exec-once = blueman-applet

# ==========================================
# INPUT & TOUCHPAD
# ==========================================
input {
    kb_layout          = us
    follow_mouse       = 1
    numlock_by_default = true
    mouse_refocus      = false

    touchpad {
        natural_scroll       = yes
        disable_while_typing = yes
        tap-to-click         = yes
        drag_lock            = yes
        tap-and-drag         = true
    }

    sensitivity = 0
}

gestures {
#    workspace_swipe                    = yes
#    workspace_swipe_fingers            = 3
    workspace_swipe_distance           = 300
    workspace_swipe_invert             = yes
#    workspace_swipe_min_speed_to_handle = 30
    workspace_swipe_cancel_ratio       = 0.5
    workspace_swipe_create_new         = yes
    workspace_swipe_forever            = yes
}

# LOOK & FEEL — Handled by theme.conf (sourced at top)

dwindle {
    pseudotile = yes
    preserve_split = yes
    smart_split = no
    special_scale_factor = 0.8
}

master {
    new_status = master
}

misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    vfr                      = true
    vrr                      = 1
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    background_color         = 0x141413
    enable_swallow           = true
    swallow_regex            = ^(kitty)$
    focus_on_activate       = true
    initial_workspace_tracking = 1
}

# ==========================================
# HYPRBARS & PLUGINS
# ==========================================
