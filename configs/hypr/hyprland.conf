# ==========================================
# WINDOW RULES
# ==========================================
windowrule = match:class ^pavucontrol|blueman-manager|nm-connection-editor|org.kde.polkit-kde-authentication-agent-1$, float 1
windowrule = match:class ^thunar$ match:title ^File Operation.*$, float 1
windowrule = match:title ^Open File|Save As|Picture-in-Picture|nm-applet$, float 1
windowrule = match:class ^pavucontrol$, center 1
windowrule = match:class ^wofi$, suppress_event activatefocus

# Smart Gaps (Matikan gap pas cuma ada 1 window)
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = match:workspace w[tv1] match:floating 0, border_size 0, rounding 0
windowrule = match:workspace f[1] match:floating 0, border_size 0, rounding 0

# Opacity & Blur
windowrule = match:class ^kitty$, opacity 0.92 override 0.85 override
windowrule = match:class ^thunar$, opacity 0.95 override 0.90 override

# Picture-in-Picture
windowrule = match:title ^Picture-in-Picture$, pin 1, float 1, size 480 270, move 100%-490 100%-280

# Workspace Assignments
windowrule = match:class ^firefox$, workspace 1
windowrule = match:class ^kitty$, workspace 2
windowrule = match:class ^thunar$, workspace 3
windowrule = match:class ^discord$, workspace 4
windowrule = match:class ^Spotify$, workspace 5

# ==========================================
# LAYER RULES
# ==========================================
layerrule = blur 1, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace waybar
layerrule = blur 1, match:namespace swaync-control-center
layerrule = blur 1, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.1, match:namespace swaync-control-center
layerrule = ignore_alpha 0.1, match:namespace swaync-notification-window

# ==========================================
# KEYBINDS
# ==========================================

# --- Apps & PRIME Offload ---
bind = $mainMod, Q, exec, $terminal
bind = $mainMod ALT, Q, exec, $offload $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod ALT, B, exec, $offload $browser
bind = $mainMod, E, exec, $filemanager
bind = $mainMod, R, exec, $menu

# --- Window Management ---
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# Alt-Tab (Windows style window switcher)
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = $mainMod, P, pseudo
bind = $mainMod, semicolon, layoutmsg, togglesplit
bind = $mainMod, T, pin

# --- Focus & Groups ---
# bind = $mainMod, Tab, hyprexpo:expo, toggle # Workspace Overview (ala GNOME)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, G, togglegroup
bind = $mainMod, tab, changegroupactive

# --- Resize & Swap ---
binde = $mainMod ALT, H, resizeactive, -40 0
binde = $mainMod ALT, L, resizeactive,  40 0
binde = $mainMod ALT, K, resizeactive,  0 -40
binde = $mainMod ALT, J, resizeactive,  0  40
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# --- Workspace Switch ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- Workspace Navigation ---
bind = $mainMod CTRL, right, workspace, e+1
bind = $mainMod CTRL, left,  workspace, e-1
bind = $mainMod, bracketleft,  workspace, e-1
bind = $mainMod, bracketright, workspace, e+1

# --- Move to Workspace ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Special Workspace (Scratchpad) ---
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, minus, togglespecialworkspace, minimized
bind = $mainMod SHIFT, minus, movetoworkspace, special:minimized

# --- Mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Laptop Lid ---
bindl = , switch:on:Lid Switch, exec, hyprlock
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# --- Media & Control ---
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && notify-send -h int:value:$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}') "Volume" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}')%"
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && notify-send -h int:value:$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}') "Volume" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}')%"
bind  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Screenshots ---
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date '+%Y%m%d_%H%M%S').png && notify-send "Screenshot Saved"
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f - && notify-send "Area Captured & Edited"

# --- Utilities ---
bind = $mainMod, grave, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = CTRL ALT, L, exec, hyprlock
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# --- Power Profiles ---
bind = $mainMod, F5, exec, ~/.local/bin/power-profile cycle
bind = $mainMod SHIFT, F5, exec, ~/.local/bin/power-profile menu
