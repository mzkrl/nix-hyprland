# ==========================================
# KITTY CONFIG — Terminal
# Color Scheme: Anthropic Brand
# ==========================================

# ─── Font ─────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

# ─── Cursor ───────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ─── Scroll ───────────────────────────────────────
scrollback_lines        2000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 3.0

# ─── Window ───────────────────────────────────────
remember_window_size    yes
initial_window_width    900
initial_window_height   580
window_padding_width    14
window_border_width     1.0
draw_minimal_borders    yes
hide_window_decorations yes
confirm_os_window_close 0

# ─── Tab bar ──────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      " {index}: {title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# ─── Colors: Anthropic Brand ──────────────────────
# Background = Brand Dark
background            #141413
# Foreground = Brand Light
foreground            #faf9f5

# Cursor = Orange accent
cursor                #d97757
cursor_text_color     #141413

# Selection = Blue accent
selection_background  #6a9bcc
selection_foreground  #141413

# URL hover = Orange
url_color             #d97757
url_style             curly

# ─── 16 Terminal Colors (Anthropic-inspired) ──────
# Black
color0  #1e1e1d
color8  #595959
# Red
color1  #d97757
color9  #e08b6e
# Green
color2  #788c5d
color10 #8fa372
# Yellow
color3  #c9a96e
color11 #d4b87e
# Blue
color4  #6a9bcc
color12 #85afd4
# Magenta / Purple
color5  #9b7aad
color13 #b090c2
# Cyan
color6  #5fa8a8
color14 #76bcbc
# White
color7  #e8e6dc
color15 #faf9f5

# Tab colors
active_tab_background    #d97757
active_tab_foreground    #141413
inactive_tab_background  #1e1e1d
inactive_tab_foreground  #b0aea5
tab_bar_background       #141413

# ─── Misc ─────────────────────────────────────────
enable_audio_bell        no
visual_bell_duration     0.0
window_alert_on_bell     yes
bell_on_tab              "🔔 "
term                     xterm-256color
shell_integration        enabled
allow_cloning            ask

# ─── Keybinds tambahan ────────────────────────────
# Ctrl+Shift+T = Tab baru
# Ctrl+Shift+W = Tutup tab
# Ctrl+Shift+Right/Left = Pindah tab

# Split pane
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window
map ctrl+shift+f5       load_config_file
