# ==========================================
# HYPRLOCK CONFIG — Lock Screen
# Color Scheme: Anthropic Brand
# ==========================================

general {
    disable_loading_bar = false
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
}

# Background — blur wallpaper
background {
    monitor  =
    path     = screenshot   # Screenshot desktop lalu blur
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.6
    contrast    = 1.0
    vibrancy    = 0.1696
    vibrancy_darkness = 0.0
}

# Jam besar di tengah
label {
    monitor  =
    text     = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color    = rgba(faf9f5ff)
    font_size   = 90
    font_family = Poppins Bold

    position = 0, 80
    halign   = center
    valign   = center
}

# Tanggal
label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color    = rgba(b0aea5ff)
    font_size   = 18
    font_family = Poppins

    position = 0, -10
    halign   = center
    valign   = center
}

# Input password
input-field {
    monitor  =
    size     = 280, 50
    outline_thickness = 2

    # Warna brand
    outer_color   = rgba(d97757ff)          # Orange border
    inner_color   = rgba(141413cc)          # Dark bg
    font_color    = rgba(faf9f5ff)          # Light text
    check_color   = rgba(788c5dff)          # Green saat sukses
    fail_color    = rgba(d97757ff)          # Orange saat gagal

    placeholder_text = <i>Password...</i>
    fail_text        = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input       = false
    rounding         = 8

    position = 0, -120
    halign   = center
    valign   = center
}

# Label "ketik password"
label {
    monitor  =
    text     = Ketik password untuk unlock
    color    = rgba(b0aea5cc)
    font_size   = 13
    font_family = Poppins

    position = 0, -180
    halign   = center
    valign   = center
}
