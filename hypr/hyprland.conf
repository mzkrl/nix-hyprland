# ==========================================
# CONFIG HYPRLAND — SIRIUS / DARK SPACE
# Optimized for: NixOS + NVIDIA PRIME + Laptop
# ==========================================

autogenerated = 0

# ==========================================
# MONITOR
# ==========================================
monitor = , highres, auto, 1

# ==========================================
# ENVIRONMENT VARIABLES
# ==========================================
# (Sebagian besar sudah ada di nix-config-now.nix lo)
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Adwaita
env = AQ_NO_MODIFIERS, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# NVIDIA Specific (Double check di Nix Config juga)
env = LIBVA_DRIVER_NAME, nvidia
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = GBM_BACKEND, nvidia-drm

# ==========================================
# CURSOR
# ==========================================
cursor {
    no_hardware_cursors = true
    inactive_timeout    = 3
    hide_on_key_press   = true
}

# Enforce cursor theme for X11/GTK apps in Hyprland
exec-once = hyprctl setcursor Adwaita 24
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Adwaita

# ==========================================
# VARIABLES
# ==========================================
$terminal    = kitty
$browser     = firefox
$filemanager = thunar
$menu        = wofi --show drun --allow-images
$mainMod     = SUPER
$offload     = nvidia-offload

# ==========================================
# AUTOSTART
# ==========================================
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = waybar
exec-once = caelestia shell
exec-once = hyprpaper
# exec-once = dunst # Managed by home-manager
exec-once = /run/current-system/sw/libexec/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# exec-once = hypridle # Managed by home-manager
exec-once = nm-applet --indicator
exec-once = blueman-applet

# ==========================================
# INPUT & TOUCHPAD
# ==========================================
input {
    kb_layout          = us
    follow_mouse       = 1
    numlock_by_default = true
    mouse_refocus      = false

    touchpad {
        natural_scroll       = yes
        disable_while_typing = yes
        tap-to-click         = yes
        drag_lock            = yes
        tap-and-drag         = true
    }

    sensitivity = 0
}

gestures {
#    workspace_swipe                    = yes
#    workspace_swipe_fingers            = 3
    workspace_swipe_distance           = 300
    workspace_swipe_invert             = yes
#    workspace_swipe_min_speed_to_handle = 30
    workspace_swipe_cancel_ratio       = 0.5
    workspace_swipe_create_new         = yes
    workspace_swipe_forever            = yes
}

# ==========================================
# LOOK & FEEL
# ==========================================
general {
    gaps_in    = 2
    gaps_out   = 4
    border_size = 2

    col.active_border   = rgba(d97757ee) rgba(6a9bccee) 45deg
    col.inactive_border = rgba(b0aea5aa)

    layout           = dwindle
    resize_on_border = true
    
    allow_tearing = false
}

decoration {
    rounding = 10

    blur {
        enabled           = true
        size              = 6
        passes            = 3
        vibrancy          = 0.1696
        ignore_opacity    = on
        xray              = true
        new_optimizations = true
    }

    shadow {
        enabled      = true
        range        = 10
        render_power = 4
        color        = rgba(14141399)
    }

    active_opacity     = 1.0
    inactive_opacity   = 0.96
}

animations {
    enabled = yes

    # GNOME-style curves
    bezier = fluent_decel, 0, 0.2, 0.4, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1

    animation = windows, 1, 3, fluent_decel, popin 60%
    animation = windowsIn, 1, 3, fluent_decel, popin 60%
    animation = windowsOut, 1, 3, fluent_decel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 2.5, default
    animation = workspaces, 1, 3.5, easeOutExpo, slide
    animation = specialWorkspace, 1, 3, fluent_decel, slidevert
}

dwindle {
    pseudotile = yes
    preserve_split = yes
    smart_split = no
    special_scale_factor = 0.8
}

master {
    new_status = master
}

misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    vfr                      = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    background_color         = 0x141413
    enable_swallow           = true
    swallow_regex            = ^(kitty)$
    focus_on_activate       = true
    initial_workspace_tracking = 1
}

# ==========================================
# HYPRBARS & PLUGINS
# ==========================================
plugin {
    hyprbars {
        bar_height = 28
        bar_color = rgba(141413ff)
        col.text = rgba(faf9f5ff)
        bar_text_font = Poppins SemiBold
        bar_text_size = 11
        bar_pre_cedence = 1
        
        # Close (Orange), Maximize (Blue), Minimize (Gray to Scratchpad)
        hyprbars-button = rgba(d97757ff), 12, , hyprctl dispatch killactive
        hyprbars-button = rgba(6a9bccff), 12, , hyprctl dispatch fullscreen 1
        hyprbars-button = rgba(b0aea5ff), 12, , hyprctl dispatch movetoworkspacesilent special:minimized
    }

    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current # [center current/first 1...]
        
        enable_gesture = true # laptop touchpad
        gesture_fingers = 3
        gesture_distance = 300
        gesture_positive = true
    }
}
# ==========================================
# WINDOW RULES
# ==========================================
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor|org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation*)
windowrulev2 = float, title:^(Open File|Save As|Picture-in-Picture|nm-applet)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = stayfocused, class:^(wofi)$

# Smart Gaps (Matikan gap pas cuma ada 1 window - ala GNOME)
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# Opacity & Blur
windowrulev2 = opacity 0.92 0.85, class:^(kitty)$
windowrulev2 = opacity 0.95 0.90, class:^(thunar)$
windowrulev2 = blur, class:^(kitty)$
windowrulev2 = blur, class:^(thunar)$

# Picture-in-Picture
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-490 100%-280, title:^(Picture-in-Picture)$

# Workspace Assignments
windowrulev2 = workspace 1, class:^(firefox)$
windowrulev2 = workspace 2, class:^(kitty)$
windowrulev2 = workspace 3, class:^(thunar)$
windowrulev2 = workspace 4, class:^(discord)$
windowrulev2 = workspace 5, class:^(Spotify)$

# ==========================================
# KEYBINDS
# ==========================================

# --- Apps & PRIME Offload ---
bind = $mainMod, Q, exec, $terminal
bind = $mainMod ALT, Q, exec, $offload $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod ALT, B, exec, $offload $browser
bind = $mainMod, E, exec, $filemanager
bind = $mainMod, R, exec, $menu

# --- Window Management ---
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, T, pin
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop

# --- Focus & Groups ---
bind = $mainMod, Tab, hyprexpo:expo, toggle # Workspace Overview (ala GNOME)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, G, togglegroup
bind = $mainMod, tab, changegroupactive

# --- Resize & Swap ---
binde = $mainMod ALT, H, resizeactive, -40 0
binde = $mainMod ALT, L, resizeactive,  40 0
binde = $mainMod ALT, K, resizeactive,  0 -40
binde = $mainMod ALT, J, resizeactive,  0  40
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# --- Workspace Switch ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- Workspace Navigation ---
bind = $mainMod CTRL, right, workspace, e+1
bind = $mainMod CTRL, left,  workspace, e-1
bind = $mainMod, bracketleft,  workspace, e-1
bind = $mainMod, bracketright, workspace, e+1

# --- Move to Workspace ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Special Workspace (Scratchpad) ---
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, minus, movetoworkspace, special:minimized
bind = $mainMod SHIFT, minus, togglespecialworkspace, minimized

# --- Mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Laptop Lid ---
bindl = , switch:on:Lid Switch, exec, hyprlock
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# --- Media & Control ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && notify-send -h int:value:$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}') "Volume" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}')%"
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && notify-send -h int:value:$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}') "Volume" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}')%"
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Screenshots ---
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date '+%Y%m%d_%H%M%S').png && notify-send "Screenshot Saved"
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f - && notify-send "Area Captured & Edited"

# --- Utilities ---
bind = $mainMod, grave, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, L, exec, hyprlock
bind = CTRL ALT, L, exec, hyprlock
bind = $mainMod, P, exec, hyprpicker -a
