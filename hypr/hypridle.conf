# ==========================================
# HYPRIDLE CONFIG — Auto Screen Lock
# ==========================================

general {
    lock_cmd        = pidof hyprlock || hyprlock   # Jangan double lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on    # Nyalain layar lagi setelah wake
}

# 5 menit: Redup layar
listener {
    timeout  = 300
    on-timeout = brightnessctl -s set 20%
    on-resume  = brightnessctl -r
}

# 8 menit: Lock screen
listener {
    timeout  = 480
    on-timeout = loginctl lock-session
}

# 10 menit: Matiin layar (DPMS off)
listener {
    timeout  = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 15 menit: Suspend (hemat baterai)
listener {
    timeout  = 900
    on-timeout = systemctl suspend
}
